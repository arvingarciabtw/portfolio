<!doctype html>
<html lang="en" data-theme="">
  <head>
		<script>
			(function () {
				var match = document.cookie.match(/(?:^|; )theme=([^;]+)/);
				var theme = match
					? match[1]
					: window.matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark-hard'
						: 'light-hard';
				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="software dev based in the philippines." />
		<meta property="og:site_name" content="arvin garcia" />
		<link
			rel="preload"
			href="/fonts/commit-mono-vf.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
  <body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
